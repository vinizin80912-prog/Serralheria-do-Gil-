<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serralheria do Gil - Portões, Grades e Estruturas Metálicas</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Framer Motion -->
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            orange: {
              DEFAULT: '#D97706',
              light: '#F59E0B',
              dark: '#B45309',
            },
            steel: {
              DEFAULT: '#4B5563',
              light: '#9CA3AF',
              dark: '#1F2937',
            },
            dark: '#0F0F0F',

          fontFamily: {
            display: ['Oswald', 'sans-serif'],

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Roboto', sans-serif;
      background: #0F0F0F;
      color: #F3F4F6;
      overflow-x: hidden;
    }
    
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Oswald', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    ::-webkit-scrollbar {
      width: 10px;
    }
    
    ::-webkit-scrollbar-track {
      background: #1F2937;
    }
    
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #D97706, #B45309);
      border-radius: 5px;
    }
    
    .text-gradient {
      background: linear-gradient(135deg, #F59E0B 0%, #D97706 50%, #B45309 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .card-steel {
      background: linear-gradient(135deg, #1F2937 0%, #111827 100%);
      border: 1px solid rgba(217, 119, 6, 0.2);
      border-radius: 16px;
      transition: all 0.3s ease;
    }
    
    .card-steel:hover {
      border-color: rgba(217, 119, 6, 0.5);
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(217, 119, 6, 0.1);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #D97706 0%, #B45309 100%);
      color: white;
      padding: 14px 32px;
      border-radius: 8px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(217, 119, 6, 0.4);
    }
    
    .btn-outline {
      background: transparent;
      color: #D97706;
      padding: 14px 32px;
      border-radius: 8px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 2px solid #D97706;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-outline:hover {
      background: rgba(217, 119, 6, 0.1);
      transform: translateY(-2px);
    }
    
    .input-field {
      width: 100%;
      padding: 14px 18px;
      background: #1F2937;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #F3F4F6;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    
    .input-field:focus {
      outline: none;
      border-color: #D97706;
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.2);
    }
    
    .input-field::placeholder {
      color: #6B7280;
    }
    
    .spark {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #F59E0B;
      border-radius: 50%;
      pointer-events: none;
      animation: spark-fly 1s ease-out forwards;
    }
    
    @keyframes spark-fly {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }
    
    .glow-text {
      text-shadow: 0 0 20px rgba(217, 119, 6, 0.5);
    }
    
    .metal-texture {
      background: linear-gradient(135deg, #374151 0%, #1F2937 50%, #111827 100%);
      position: relative;
      overflow: hidden;
    }
    
    .metal-texture::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.02) 2px,
        rgba(255,255,255,0.02) 4px
      );
      pointer-events: none;
    }
    
    .whatsapp-float {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 60px;
      height: 60px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
      z-index: 1000;
      transition: all 0.3s ease;
      animation: pulse-whatsapp 2s infinite;
    }
    
    .whatsapp-float:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 30px rgba(37, 211, 102, 0.6);
    }
    
    @keyframes pulse-whatsapp {
      0%, 100% { box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4); }
      50% { box-shadow: 0 4px 30px rgba(37, 211, 102, 0.7); }
    }
    
    .grid-pattern {
      background-image: 
        linear-gradient(rgba(217, 119, 6, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(217, 119, 6, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }
  </style>
</head>
<body>

          <span className="text-white font-medium">{message}</span>
        </motion.div>
      );
    };
    
    // ===== APP PRINCIPAL =====
    const App = () => {
      const [activeSection, setActiveSection] = useState('inicio');
      const [toast, setToast] = useState(null);
      
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
      };
      
      const scrollToSection = (id) => {
        const element = document.getElementById(id);
        if (element) {
          element.scrollIntoView({ behavior: 'smooth' });
          setActiveSection(id);
        }
      };
      
      // Detectar seção ativa no scroll
      useEffect(() => {
        const handleScroll = () => {
          const sections = ['inicio', 'servicos', 'portfolio', 'sobre', 'contato'];
          const scrollPosition = window.scrollY + 100;
          
          for (const section of sections) {
            const element = document.getElementById(section);
            if (element) {
              const { offsetTop, offsetHeight } = element;
              if (scrollPosition >= offsetTop && scrollPosition < offsetTop + offsetHeight) {
                setActiveSection(section);
                break;
              }
            }
          }
        };
        
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);
      
      return (
        <div className="min-h-screen bg-dark">
          <AnimatePresence>
            {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
          </AnimatePresence>

            <Hero scrollToSection={scrollToSection} />
            <Servicos />

            <Sobre />
            <Contato showToast={showToast} />
          </main>
          
          <Footer />
          <WhatsAppButton />
        </div>
      );
